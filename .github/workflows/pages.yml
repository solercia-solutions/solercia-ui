name: Pages

# Publishes the showcase (live demos + the Guides built from docs/manual) to GitHub Pages at
# https://solercia-solutions.github.io/solercia-ui/ on every push to main.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build showcase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Library, guides (docs/manual -> projects/showcase/public/docs-content) and the showcase.
      - name: Build
        run: |
          npm run build
          npm run docs:site
          npx ng build showcase --base-href /solercia-ui/

      # Single-page app: one <route>.html entry point per route (deep links answer 200) and 404.html.
      - name: SPA entry points
        run: node scripts/pages-fallbacks.mjs dist/showcase/browser

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/showcase/browser

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
