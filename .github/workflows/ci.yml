name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `npm test` builds the library and the schematics before running Vitest.
      - name: Build + test
        run: npm test

      - name: Test the publish script (fake npm, no network)
        run: bash .github/scripts/publish-if-unpublished.test.sh
